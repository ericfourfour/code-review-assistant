[package]
name = "code-review-assistant"
version = "0.1.0"
edition = "2021"
description = "Local GUI for reviewing (AI-generated) code comments one at a time, with model-suggested replacements"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

# Real parsers for semantic units: scope detection and definition-boundary
# splitting go through tree-sitter grammars, never hand-rolled scanning.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"

[profile.release]
lto = "thin"
