name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset-suffix: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset-suffix: windows-x86_64
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            asset-suffix: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release executable
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package and upload Unix executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="code-review-assistant-${GITHUB_REF_NAME}-${{ matrix.asset-suffix }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" code-review-assistant
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber

      - name: Package and upload Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "code-review-assistant-$env:GITHUB_REF_NAME-${{ matrix.asset-suffix }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/release/code-review-assistant.exe -DestinationPath $archive
          gh release upload $env:GITHUB_REF_NAME $archive --clobber
